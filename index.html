<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos | Construirte</title>
  <meta name="description" content="Catálogo de productos Construirte." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo" aria-label="Construirte - inicio"><img src="logo.svg" alt="Construirte" /></a>
      <nav class="nav">
        <a href="#productos" class="is-active">Productos</a>
      </nav>
      <button class="cart-btn" id="cartBtn" aria-label="Abrir carrito">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="banner">
      <div class="container">
        <h1>Productos</h1>
        <p>Materiales y soluciones para construir con calidad.</p>
      </div>
    </section>

    <section class="container catalog" id="productos">
      <aside class="sidebar">
        <h2>Categorías</h2>
        <ul id="filters"></ul>
        <label class="search">
          <span>Buscar</span>
          <input type="search" id="search" placeholder="Nombre del producto" />
        </label>
      </aside>
      <div>
        <p class="results" id="results"></p>
        <div class="products" id="products"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <img src="logo.svg" alt="Construirte" class="footer__logo" />
      <p>&copy; <span id="year"></span> Construirte</p>
    </div>
  </footer>

  <!-- Detalle de producto -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" id="modalBody"></div>
  </div>

  <!-- Carrito -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="cart" id="cart" aria-hidden="true">
    <div class="cart__head">
      <h2>Tu pedido</h2>
      <button class="close" id="cartClose" aria-label="Cerrar">&times;</button>
    </div>
    <div class="cart__items" id="cartItems"></div>
    <div class="cart__foot">
      <div class="cart__total"><span>Total</span><strong id="cartTotal">$0</strong></div>
      <button class="btn" id="checkoutBtn" disabled>Finalizar pedido</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="productos.js"></script>
  <script src="script.js"></script>
</body>
</html>
